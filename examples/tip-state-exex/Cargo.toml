[package]
name = "example-tip-state-exex"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
alloy-consensus = { workspace = true, features = ["std"] }
alloy-eips = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std"] }
eyre.workspace = true
futures-util.workspace = true
reth-ethereum-primitives = { workspace = true, features = ["std"] }
reth-db = { workspace = true, features = ["mdbx"] }
reth-db-api = { workspace = true }
reth-ethereum = { workspace = true, features = ["full", "cli"] }
reth-evm = { workspace = true, features = ["std"] }
reth-evm-ethereum = { workspace = true, features = ["std"] }
reth-execution-types = { workspace = true, features = ["std"] }
reth-provider = { workspace = true }
reth-primitives-traits = { workspace = true, features = ["std"] }
reth-storage-api = { workspace = true }
reth-trie-common = { workspace = true, features = ["std"] }
revm = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror.workspace = true
tip-state-wire = { path = "../../crates/tip-state-wire" }
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
revm-database = { workspace = true, features = ["std"] }
